ry" id="clearBtn" type="button">ล้างตัวกรอง</button></div><section class="grid" id="results" aria-live="polite"></section></main><footer class="footer"><div class="wrap footerrow"><span>© 2026 Prachuap Directory</span><span><a href="/directory/history/">อ่านประวัติ</a> · <a href="/directory/contact/">ติดต่อเรา</a></span></div></footer><script>const PLACES=[{"name": "ถ้ำพระยานคร", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "ถ้ำชื่อดังในอุทยานแห่งชาติเขาสามร้อยยอด พร้อมเส้นทางเดินชมธรรมชาติ", "lat": "12.2038", "lng": "99.9895"}, {"name": "ศูนย์ศึกษาธรรมชาติ (บึงบัว)", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "เส้นทางศึกษาธรรมชาติและจุดชมวิวบึงบัวในอุทยานแห่งชาติเขาสามร้อยยอด", "lat": "12.1898", "lng": "99.8732"}, {"name": "หาดสามร้อยยอด", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "ชายหาดบรรยากาศสงบสำหรับพักผ่อนและชมวิวทะเล", "lat": "12.2185", "lng": "99.9982"}, {"name": "หาดสามพระยา", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "ชายหาดและจุดกางเต็นท์ใกล้อุทยานแห่งชาติเขาสามร้อยยอด", "lat": "12.1482", "lng": "99.9725"}, {"name": "จุดชมวิวเขาแดง", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "จุดชมวิวภูเขาและพื้นที่ชุ่มน้ำของสามร้อยยอด", "lat": "12.1158", "lng": "99.9652"}, {"name": "คลองเขาแดง (จุดล่องเรือ)", "category": "กิจกรรม", "district": "สามร้อยยอด", "desc": "ล่องเรือชมธรรมชาติและภูเขาหินปูนในคลองเขาแดง", "lat": "12.1182", "lng": "99.9680"}, {"name": "ถ้ำไทร", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "ถ้ำธรรมชาติสำหรับผู้ชื่นชอบการเดินป่าและสำรวจภูมิประเทศ", "lat": "12.1812", "lng": "99.9685"}, {"name": "อุทยานแห่งชาติเขาสามร้อยยอด", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "พื้นที่ธรรมชาติสำคัญของจังหวัด มีภูเขา ถ้ำ ชายหาด และพื้นที่ชุ่มน้ำ", "lat": "12.1125", "lng": "99.9582"}, {"name": "เกาะนมสาว", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "เกาะเล็กในอ่าวสามร้อยยอด เหมาะสำหรับชมวิวทะเล", "lat": "12.2235", "lng": "100.0085"}, {"name": "จุดชมวิวเกาะโครำ", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "จุดชมวิวชายฝั่งและหมู่เกาะของสามร้อยยอด", "lat": "12.1650", "lng": "100.0050"}, {"name": "หาดบ้านบางปู", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "ชุมชนชายฝั่งและจุดเชื่อมต่อไปยังถ้ำพระยานคร", "lat": "12.2015", "lng": "99.9782"}, {"name": "จุดลงเรือหาดบางปู", "category": "กิจกรรม", "district": "สามร้อยยอด", "desc": "จุดลงเรือสำหรับเดินทางไปถ้ำพระยานคร", "lat": "12.2022", "lng": "99.9790"}, {"name": "วัดบางปู", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "วัดท้องถิ่นใกล้ชุมชนบ้านบางปู", "lat": "12.1985", "lng": "99.9750"}, {"name": "ตลาดนัดเกาะไผ่", "category": "ร้านค้า", "district": "สามร้อยยอด", "desc": "ตลาดชุมชนสำหรับเลือกซื้ออาหารและสินค้าท้องถิ่น", "lat": "12.2410", "lng": "99.8820"}, {"name": "จุดชมวิวกังหันลม สามร้อยยอด", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "จุดชมวิวสำหรับแวะถ่ายภาพและชมภูมิทัศน์ท้องถิ่น", "lat": "12.2580", "lng": "99.8950"}, {"name": "วัดเขาแดง", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "วัดและสถานที่สำคัญของชุมชนเขาแดง", "lat": "12.1190", "lng": "99.9610"}, {"name": "จุดพายคายัค คลองเขาแดง", "category": "กิจกรรม", "district": "สามร้อยยอด", "desc": "กิจกรรมพายคายัคชมธรรมชาติในคลองเขาแดง", "lat": "12.1175", "lng": "99.9670"}, {"name": "คาเฟ่ริมทะเลสามร้อยยอด", "category": "คาเฟ่", "district": "สามร้อยยอด", "desc": "คาเฟ่บรรยากาศริมทะเลสำหรับนั่งพักและชมวิว", "lat": "12.2250", "lng": "99.9980"}, {"name": "ริมหาดคาเฟ่", "category": "คาเฟ่", "district": "สามร้อยยอด", "desc": "คาเฟ่ใกล้ชายหาดสามร้อยยอด", "lat": "12.2250", "lng": "99.9980"}, {"name": "บึงบัว คาเฟ่", "category": "คาเฟ่", "district": "สามร้อยยอด", "desc": "คาเฟ่ใกล้บึงบัวและเส้นทางศึกษาธรรมชาติ", "lat": "12.1880", "lng": "99.8710"}, {"name": "ชุมชนท่องเที่ยวบ้านบางปู", "category": "ธุรกิจบริการ", "district": "สามร้อยยอด", "desc": "ชุมชนท่องเที่ยวและแหล่งเรียนรู้วิถีชีวิตชายฝั่ง", "lat": "12.2010", "lng": "99.9770"}, {"name": "ชุมชนประมงพื้นบ้านเขาแดง", "category": "ธุรกิจบริการ", "district": "สามร้อยยอด", "desc": "ชุมชนประมงพื้นบ้านและประสบการณ์ท่องเที่ยวเชิงวิถีชีวิต", "lat": "12.1160", "lng": "99.9690"}, {"name": "จุดชมวิวดอนหอยแกลบ", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "จุดชมวิวธรรมชาติและพื้นที่ชายฝั่งของชุมชน", "lat": "12.2310", "lng": "99.9920"}, {"name": "วัดห้วยลึก", "category": "สถานที่ท่องเที่ยว", "district": "สามร้อยยอด", "desc": "วัดท้องถิ่นและพื้นที่สงบสำหรับเยี่ยมชม", "lat": "12.2710", "lng": "99.8850"}, {"name": "จุดกางเต็นท์หาดสามพระยา", "category": "กิจกรรม", "district": "สามร้อยยอด", "desc": "พื้นที่กางเต็นท์ใกล้ชายหาดสามพระยา", "lat": "12.1485", "lng": "99.9720"}, {"name": "จุดกางเต็นท์หาดแหลมศาลา", "category": "กิจกรรม", "district": "สามร้อยยอด", "desc": "จุดพักแรมใกล้เส้นทางธรรมชาติและชายหาดแหลมศาลา", "lat": "12.2040", "lng": "99.9890"}];const params=new URLSearchParams(location.search);const q=document.getElementById('q'),category=document.getElementById('category'),results=document.getElementById('results'),resultText=document.getElementById('resultText');q.value=params.get('q')||'';category.value=params.get('category')||'ทั้งหมด';if(![...category.options].some(o=>o.value===category.value))category.value='ทั้งหมด';function esc(v){return String(v).replace(/[&<>&"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const term=q.value.trim().toLocaleLowerCase('th');const cat=category.value;const found=PLACES.filter(p=>(!term||[p.name,p.category,p.district,p.desc].join(' ').toLocaleLowerCase('th').includes(term))&&(cat==='ทั้งหมด'||p.category===cat));resultText.textContent=`พบ ${found.length} แห่ง${term?` จากคำค้น “${esc(q.value)}”`:''}${cat!=='ทั้งหมด'?` ในหมวด ${cat}`:''}`;results.innerHTML=found.length?found.map(p=>`<article class="card"><span class="tag">${esc(p.category)}</span><h2>${esc(p.name)}</h2><p class="meta">อำเภอ${esc(p.district)} · พิกัด ${esc(p.lat)}, ${esc(p.lng)}</p><p>${esc(p.desc)}</p><div class="actions"><a target="_blank" rel="noreferrer" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}">เปิดแผนที่ ↗</a></div></article>`).join(''):'<div class="empty"><strong>ไม่พบสถานที่ที่ตรงกับตัวกรอง</strong><br>ลองใช้คำค้นอื่น หรือกด “ล้างตัวกรอง” เพื่อดูทั้งหมด</div>';const next=new URLSearchParams();if(q.value.trim())next.set('q',q.value.trim());if(cat!=='ทั้งหมด')next.set('category',cat);const target=next.toString()?`/directory/search/?${next.toString()}`:'/directory/search/';history.replaceState(null,'',target)}document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();render()});document.getElementById('clearBtn').addEventListener('click',()=>{q.value='';category.value='ทั้งหมด';render();q.focus()});render();</script></body></html>
